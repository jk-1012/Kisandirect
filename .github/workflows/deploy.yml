name: Build → Test → Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1. Lint + Type Check ──────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ── 2. Unit Tests ─────────────────────────────────────────────────────────
  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kisandirect_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:test
        env:
          DATABASE_URL: postgres://test:test@localhost/kisandirect_test
      - run: npm test -- --coverage --ci
        env:
          DATABASE_URL: postgres://test:test@localhost/kisandirect_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          minimum_coverage: 80

  # ── 3. Security Scanning ──────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1  # fail on CRITICAL/HIGH
      - name: npm audit
        run: npm audit --audit-level=high

  # ── 4. Docker Build + Push ────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [test-unit, security]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/kisandirect-api:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/kisandirect-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/kisandirect-web:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/kisandirect-web:latest

  # ── 5. GitOps: Update ArgoCD manifests ───────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          repository: [YOUR_GITHUB_ORG]/kisandirect-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update staging image tags
        run: |
          cd k8s/overlays/staging
          kustomize edit set image \
            kisandirect-api=${{ env.ECR_REGISTRY }}/kisandirect-api:${{ env.IMAGE_TAG }} \
            kisandirect-web=${{ env.ECR_REGISTRY }}/kisandirect-web:${{ env.IMAGE_TAG }}
          git config user.email "ci@kisandirect.in"
          git config user.name "KisanDirect CI"
          git add .
          git commit -m "chore: deploy ${{ env.IMAGE_TAG }} to staging [skip ci]"
          git push
      # ArgoCD auto-syncs staging within 3 minutes

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production    # requires manual approval in GitHub Environments
    steps:
      - uses: actions/checkout@v4
        with:
          repository: [YOUR_GITHUB_ORG]/kisandirect-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update production image tags
        run: |
          cd k8s/overlays/production
          kustomize edit set image \
            kisandirect-api=${{ env.ECR_REGISTRY }}/kisandirect-api:${{ env.IMAGE_TAG }} \
            kisandirect-web=${{ env.ECR_REGISTRY }}/kisandirect-web:${{ env.IMAGE_TAG }}
          git config user.email "ci@kisandirect.in"
          git config user.name "KisanDirect CI"
          git add .
          git commit -m "chore: deploy ${{ env.IMAGE_TAG }} to production [skip ci]"
          git push
