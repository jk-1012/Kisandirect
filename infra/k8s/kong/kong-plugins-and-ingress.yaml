# Kong plugins: rate limiting, JWT, request id and correlation id
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: otp-rate-limit
  namespace: kisandirect
plugin: rate-limiting
config:
  minute: 3          # OTP endpoint: 3 requests/minute per consumer
  policy: redis
  redis_host: redis-service
  redis_port: 6379
  hide_client_headers: false

---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: api-rate-limit
  namespace: kisandirect
plugin: rate-limiting
config:
  minute: 300        # General API: 300 req/min per authenticated user
  policy: redis
  redis_host: redis-service

---
# JWT validation plugin
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: jwt-auth
  namespace: kisandirect
plugin: jwt
config:
  secret_is_base64: false
  key_claim_name: kid
  claims_to_verify: ["exp"]

---
# Request transformer: inject request ID
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: request-id
  namespace: kisandirect
plugin: request-transformer
config:
  add:
    headers:
      - "X-Request-ID:$(uuid)"

---
# Correlation ID
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: correlation-id
  namespace: kisandirect
plugin: correlation-id
config:
  header_name: X-Correlation-ID
  generator: uuid#counter

---
# Kong Ingress Routes
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kisandirect-ingress
  namespace: kisandirect
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/plugins: jwt-auth,api-rate-limit,request-id,correlation-id
    konghq.com/strip-path: "false"
spec:
  rules:
    - host: api.kisandirect.in
      http:
        paths:
          - path: /api/v1/auth/otp
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 3000
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 3000
